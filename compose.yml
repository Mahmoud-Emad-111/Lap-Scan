services:
  laravel:
    build:
      context: .
      dockerfile: Docker/php/Dockerfile
      target: development
    volumes:
      - ./:/var/www/html
    environment:
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}"
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_APP_ID: ${REVERB_APP_ID:-lap-local}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-local-reverb-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-local-reverb-secret}
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-storage/app/firebase-service-account.json}
    depends_on:
      - mysql
    networks:
      - laravel
  queue:
    build:
      context: .
      dockerfile: Docker/php/Dockerfile
      target: development
    command: php artisan queue:work database --sleep=1 --tries=3 --timeout=60
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    environment:
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_APP_ID: ${REVERB_APP_ID:-lap-local}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-local-reverb-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-local-reverb-secret}
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-storage/app/firebase-service-account.json}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - laravel
  reverb:
    build:
      context: .
      dockerfile: Docker/php/Dockerfile
      target: development
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    restart: unless-stopped
    environment:
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_APP_ID: ${REVERB_APP_ID:-lap-local}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-local-reverb-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-local-reverb-secret}
    ports:
      - "${REVERB_PUBLISH_PORT:-8080}:8080"
    volumes:
      - ./:/var/www/html
    depends_on:
      - laravel
    networks:
      - laravel
  frontend:
    build:
      context: .
      dockerfile: Docker/Frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost}
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-local-reverb-key}
      VITE_REVERB_HOST: ${VITE_REVERB_BROWSER_HOST:-localhost}
      VITE_REVERB_PORT: ${VITE_REVERB_BROWSER_PORT:-8080}
      VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
      VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    depends_on:
      - laravel
    networks:
      - laravel
  app:
    build:
      context: .
      dockerfile: Docker/PatientApp/Dockerfile
    ports:
      - "${PATIENT_APP_PORT:-5174}:5174"
    environment:
      VITE_API_BASE_URL: ${PATIENT_APP_API_URL:-http://localhost}
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-local-reverb-key}
      VITE_REVERB_HOST: ${VITE_REVERB_BROWSER_HOST:-localhost}
      VITE_REVERB_PORT: ${VITE_REVERB_BROWSER_PORT:-8080}
      VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
      VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
      HOST: 0.0.0.0
    env_file:
      - ./patient-app/.env
    volumes:
      - ./patient-app:/app
      - /app/node_modules
    depends_on:
      - laravel
    networks:
      - laravel
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u${DB_USERNAME}",
          "-p${DB_PASSWORD}"
      ]

      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - laravel
  nginx:
    build:
      context: .
      dockerfile: Docker/Nginx/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-local-reverb-key}
        VITE_REVERB_HOST: ${VITE_REVERB_BROWSER_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_BROWSER_PORT:-8080}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./public:/var/www/html/public
      - ./storage/app/public:/var/www/html/public/storage
    depends_on:
      - laravel
    networks:
      - laravel
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - laravel
volumes:
  mysql_data:

networks:
  laravel:
