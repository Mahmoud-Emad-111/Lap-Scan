services:
  laravel:
    build:
      context: .
      dockerfile: Docker/php/Dockerfile
      target: development
    volumes:
      - ./:/var/www/html
    environment:
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    depends_on:
      - mysql
    networks:
      - laravel
  queue:
    build:
      context: .
      dockerfile: Docker/php/Dockerfile
      target: development
    command: php artisan queue:work database --sleep=1 --tries=3 --timeout=60
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    environment:
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - laravel
  reverb:
    build:
      context: .
      dockerfile: Docker/php/Dockerfile
      target: development
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    restart: unless-stopped
    ports:
      - "${REVERB_PUBLISH_PORT:-8080}:8080"
    volumes:
      - ./:/var/www/html
    depends_on:
      - laravel
    networks:
      - laravel
  frontend:
    build:
      context: .
      dockerfile: Docker/Frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost}
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-local-reverb-key}
      VITE_REVERB_HOST: ${VITE_REVERB_BROWSER_HOST:-localhost}
      VITE_REVERB_PORT: ${VITE_REVERB_BROWSER_PORT:-8082}
      VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - laravel
    networks:
      - laravel
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u${DB_USERNAME}",
          "-p${DB_PASSWORD}"
      ]

      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - laravel
  nginx:
    build:
      context: .
      dockerfile: Docker/Nginx/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-local-reverb-key}
        VITE_REVERB_HOST: ${VITE_REVERB_BROWSER_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_BROWSER_PORT:-8082}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./public:/var/www/html/public
      - ./storage/app/public:/var/www/html/public/storage
    depends_on:
      - laravel
    networks:
      - laravel
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - laravel
volumes:
  mysql_data:

networks:
  laravel:
